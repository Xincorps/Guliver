<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Guliver Search</title>
    <style>
        :root {
            --bg: #000;
            --accent-gradient: linear-gradient(90deg, #EA4335, #FBBC05, #34A853, #4285F4);
            --text-secondary: rgba(255, 255, 255, 0.4);
            --card-bg: #0c0c0c;
            --card-border: rgba(255, 255, 255, 0.1);
            --btn-bg: rgba(255, 255, 255, 0.05);
            --nav-bg: rgba(18, 18, 18, 0.85);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }

        body {
            background-color: var(--bg);
            color: white;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            overflow: hidden;
            background-image: radial-gradient(circle at 50% -10%, #1a1a1a 0%, #000 70%);
        }

        .container {
            width: 100%;
            max-width: 440px;
            padding: 0 16px; /* Чуть уменьшил боковые отступы для мобилок */
            display: flex;
            flex-direction: column;
            transition: all 0.8s cubic-bezier(0.2, 1, 0.2, 1);
            transform: translateY(28vh);
        }

        .searching { transform: translateY(20px); }
        .header { text-align: center; margin-bottom: 25px; transition: 0.3s; }
        .searching .header { opacity: 0; pointer-events: none; height: 0; margin: 0; }

        /* Поиск и Волна — ФИКС ВЫЛЕТА ЗА ЭКРАН */
        .search-wrapper { 
            display: flex; 
            align-items: center; 
            position: relative; 
            width: 100%; 
            z-index: 100; 
            gap: 0;
            transition: gap 0.4s cubic-bezier(0.2, 1, 0.2, 1);
        }
        .searching .search-wrapper { gap: 12px; }
        
        .search-outer { 
            position: relative; 
            min-width: 0; /* Важно для работы flex-shrink в Chrome/Safari */
            flex: 1;
            padding: 1px; 
            border-radius: 24px; 
            background: rgba(255, 255, 255, 0.12); 
            transition: all 0.4s;
        }
        
        .search-inner { background: #080808; border-radius: 23px; display: flex; align-items: center; padding: 10px 12px; gap: 8px; position: relative; z-index: 2; }
        input { flex: 1; background: transparent; border: none; outline: none; color: white; font-size: 16px; min-width: 0; width: 100%; }

        /* Кнопка отмена — ФИКС ПОЗИЦИИ */
        .cancel-btn { 
            color: #fff; 
            opacity: 0; 
            transition: all 0.4s cubic-bezier(0.2, 1, 0.2, 1); 
            cursor: pointer; 
            font-size: 15px;
            max-width: 0; 
            overflow: hidden; 
            white-space: nowrap;
            flex-shrink: 0; /* Не дает кнопке сжиматься или уезжать */
        }
        .searching .cancel-btn { opacity: 0.8; max-width: 70px; margin-right: 4px; }

        /* Тап-бар — ИКОНКА СООБЩЕНИЯ ПО ЦЕНТРУ */
        .bottom-nav {
            position: fixed;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--nav-bg);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            padding: 8px 12px;
            border-radius: 32px;
            border: 1px solid var(--card-border);
            display: flex;
            align-items: center;
            gap: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            z-index: 1000;
        }
        
        .nav-item {
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            border-radius: 50%;
            transition: 0.2s;
            cursor: pointer;
            position: relative;
        }
        .nav-item.active { color: #fff; background: rgba(255,255,255,0.08); }
        .nav-icon { width: 22px; height: 22px; stroke-width: 2.2; fill: none; stroke: currentColor; }
        .badge { position: absolute; top: 12px; right: 12px; width: 6px; height: 6px; background: #EA4335; border-radius: 50%; }

        /* Остальные стили из прошлой версии */
        .wave-container { position: absolute; inset: 0; border-radius: 24px; overflow: hidden; z-index: 1; pointer-events: none; }
        .wave-layer {
            position: absolute; top: 50%; left: 50%; width: 200%; height: 500%;
            background: conic-gradient(from 0deg, transparent 60%, #EA4335, #FBBC05, #34A853, #4285F4, transparent 100%);
            transform: translate(-50%, -50%) rotate(0deg); opacity: 0;
        }
        .wave-active .wave-layer { animation: rotateWave 1.5s linear; opacity: 1; }
        @keyframes rotateWave { 0% { transform: translate(-50%, -50%) rotate(0deg); } 100% { transform: translate(-50%, -50%) rotate(360deg); } }

        .region-trigger {
            display: flex; align-items: center; gap: 4px; font-size: 12px; color: var(--text-secondary);
            background: rgba(255, 255, 255, 0.08); padding: 6px 10px; border-radius: 16px;
        }
        
        .tabs-container { display: none; gap: 6px; margin-top: 16px; }
        .searching .tabs-container { display: flex; animation: slideUp 0.5s ease; }
        .tab-item { padding: 8px 16px; background: rgba(255, 255, 255, 0.03); border-radius: 10px; font-size: 14px; color: var(--text-secondary); }
        .tab-item.active { background: rgba(255, 255, 255, 0.12); color: #fff; }

        .results-container {
            display: none; flex-direction: column; gap: 10px; margin-top: 18px;
            overflow-y: auto; scrollbar-width: none;
            max-height: calc(100vh - 230px);
            padding-bottom: 100px;
        }
        .searching .results-container { display: flex; animation: slideUp 0.7s ease; }

        .message-card { background: var(--card-bg); border-radius: 16px; padding: 16px; border: 1px solid var(--card-border); }
        .message-header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
        .message-avatar { width: 36px; height: 36px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.1); }
        .message-username { font-size: 14px; font-weight: 600; display: block; }
        .message-timestamp { font-size: 11px; color: var(--text-secondary); }
        
        /* Увеличенные кнопки чата и профиля */
        .message-actions { display: flex; gap: 8px; justify-content: flex-end; }
        .action-btn {
            display: flex; align-items: center; gap: 8px;
            padding: 10px 16px; background: var(--btn-bg);
            border-radius: 12px; color: #fff; font-size: 14px; font-weight: 500;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .footer-info { margin-top: 40px; text-align: center; }
        .searching .footer-info { display: none; }
        
        .left-icon-container { width: 24px; height: 24px; position: relative; flex-shrink: 0; }
        .search-icon-img { width: 24px; height: 24px; transition: 0.3s; }
        .searching .search-icon-img { opacity: 0; transform: scale(0.8); }
        .focus-magnifier { position: absolute; width: 18px; height: 18px; stroke: #fff; opacity: 0; top: 3px; left: 3px; transition: 0.3s; fill: none; }
        .searching .focus-magnifier { opacity: 1; }

        @keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <div class="container" id="app">
        <div class="header"><h1>Guliver</h1></div>

        <div class="search-wrapper">
            <div class="search-outer" id="searchOuter">
                <div class="wave-container"><div class="wave-layer"></div></div>
                <div class="search-inner">
                    <div class="left-icon-container">
                        <img src="https://i.ibb.co/Z6BFG4Vt/gori.png" class="search-icon-img">
                        <svg class="focus-magnifier" viewBox="0 0 24 24" stroke-width="2.5"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                    </div>
                    <input type="text" id="searchInput" placeholder="Что ищем сегодня?" autocomplete="off">
                    
                    <div class="region-trigger">
                        <span id="currentRegion">Весь мир</span>
                    </div>
                </div>
            </div>
            <div class="cancel-btn" id="cancelBtn">Отмена</div>
        </div>

        <div class="tabs-container">
            <div class="tab-item active"><span>Услуги / товары</span></div>
            <div class="tab-item"><span>Клиенты</span></div>
        </div>

        <div class="results-container" id="resultsContainer">
            <div class="message-card">
                <div class="message-header">
                    <img src="https://i.ibb.co/3sS78Z8/man.jpg" class="message-avatar">
                    <div class="message-user-info">
                        <span class="message-username">Mihail @RENTINTHAI</span>
                        <span class="message-timestamp">06:19 • 24.04.26</span>
                    </div>
                </div>
                <p class="message-body" style="margin-bottom:12px; font-size: 13px;">Помогу зарегистрировать ИП и настроить VPN. Нахожусь в Бангкоке.</p>
                <div class="message-actions">
                    <button class="action-btn">Чат</button>
                    <button class="action-btn">Профиль</button>
                </div>
            </div>
        </div>

        <div class="footer-info">
            <h2 style="font-size: 20px; margin-bottom: 8px;">Поиск по Telegram чатам</h2>
            <p style="color: var(--text-secondary); font-size: 14px;">Более 10,000 чатов в реальном времени.</p>
        </div>
    </div>

    <nav class="bottom-nav">
        <div class="nav-item" onclick="switchNav(this)">
            <div class="badge"></div>
            <svg class="nav-icon" viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
        </div>
        <div class="nav-item active" onclick="switchNav(this)">
            <svg class="nav-icon" viewBox="0 0 24 24"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
        </div>
        <div class="nav-item" onclick="switchNav(this)">
            <svg class="nav-icon" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
        </div>
    </nav>

    <script>
        const app = document.getElementById('app');
        const outer = document.getElementById('searchOuter');
        const input = document.getElementById('searchInput');
        const cancel = document.getElementById('cancelBtn');

        // Анимация волны
        setInterval(() => {
            if (!app.classList.contains('searching')) {
                outer.classList.add('wave-active');
                setTimeout(() => outer.classList.remove('wave-active'), 1500);
            }
        }, 3000);

        input.addEventListener('focus', () => {
            app.classList.add('searching');
        });

        cancel.addEventListener('click', () => {
            app.classList.remove('searching');
            input.value = '';
            input.blur();
        });

        function switchNav(el) {
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
            el.classList.add('active');
        }
    </script>
</body>
</html>
